[package]
name = "local-diffe"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6"
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "io-util", "net", "fs", "sync"] }
uuid = { version = "1", features = ["v4"] }
