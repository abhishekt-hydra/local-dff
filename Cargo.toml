[package]
name = "local-diffe"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6"
foyer = "0.22.4"
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "io-util", "net", "fs", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"

[build-dependencies]
zstd = "0.13"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
