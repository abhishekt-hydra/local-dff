[package]
name = "local-diffe"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.0"
build = "build.rs"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6"
foyer = "0.22.4"
dotenvy = "0.15"
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "io-util", "net", "fs", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"
tree-sitter = "0.25"
tree-sitter-yaml = { version = "0.7.2", default-features = false }
yaml-rust2 = { version = "0.13.0", default-features = false }

[build-dependencies]
zstd = "0.13"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
